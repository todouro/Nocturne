name: Validate static piano site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Verify local page assets
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s favicon.svg
          grep -Fq 'href="styles.css"' index.html
          grep -Fq 'src="app.js"' index.html
          grep -Fq 'href="favicon.svg"' index.html
          echo "All required static assets are present and linked."
